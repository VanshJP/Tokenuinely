[project]
name = "tokenuinely"
version = "0.1.0"
description = "Per-file semantic headers + embedding index for agentic code retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "voyageai>=0.3.0",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "typer>=0.12.0",
    "pathspec>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.2.0",
]

[project.scripts]
tokenuinely = "tokenuinely.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenuinely"]
