[workspace]
members = ["cargo:tokenuinely-rs"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Homebrew formula is published to this tap repo (create github.com/VanshJP/homebrew-tap)
tap = "VanshJP/homebrew-tap"
# Publish the Homebrew formula and the npm package on release
publish-jobs = ["homebrew", "npm"]
# Where the shell/powershell installers place the binary
install-path = "CARGO_HOME"
# Unix archive format
unix-archive = ".tar.gz"
windows-archive = ".zip"
