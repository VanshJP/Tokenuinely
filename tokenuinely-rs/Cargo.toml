[package]
name = "tokenuinely"
version = "0.4.0"
edition = "2021"
description = "Semantic codebase index for AI agents — replace grep/glob with one smart tool call"
license = "MIT"
repository = "https://github.com/VanshJP/Tokenuinely"
homepage = "https://github.com/VanshJP/Tokenuinely"
readme = "README.md"
keywords = ["mcp", "code-search", "embeddings", "ai-agents", "semantic-search"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/fixtures", ".tokenuinely", "evals"]

[[bin]]
name = "tokenuinely"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
ignore = "0.4"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
futures = "0.3"
zstd = "0.13"
regex = "1"
notify = "7"
tree-sitter = "0.24"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"

[dev-dependencies]
tempfile = "3"
